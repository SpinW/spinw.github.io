name: Build and Publish Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build static files
        id: build
        run: |
          # Install xvfb and virtualGL so can create images
          wget -q -O- https://packagecloud.io/dcommander/virtualgl/gpgkey | gpg --dearmor > VirtualGL.gpg
          sudo mv VirtualGL.gpg /etc/apt/trusted.gpg.d/
          wget https://raw.githubusercontent.com/VirtualGL/repo/main/VirtualGL.list
          sudo mv VirtualGL.list /etc/apt/sources.list.d/
          sudo apt update
          sudo apt install libegl1 libxcb-cursor0 xvfb virtualgl libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          git clone https://github.com/spinw/pySpinW
          cd pySpinW && git checkout docs_update && cd ..
          mv pySpinW ..
          # Start the Xvfb server
          Xvfb :0 -screen 0 1024x768x24 +extension GLX +render -noreset >> xsession.log 2>&1 &
          DISPLAY=:0 vglrun uv run python ../pySpinW/tools/generate_tutorial_files.py
          mv ../pySpinW/examples/tutorials/tutorial_outputs docs/pyspinw/tutorials
          mv docs/pyspinw/tutorials/index.md docs/pyspinw/tutorials.md
          uv run sphinx-build -M clean docs docs/_build
          uv run sphinx-build -M html docs docs/_build
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
      - name: Setup tmate session
        if: ${{ failure() }}
        uses: owenthereal/action-upterm@v2

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
