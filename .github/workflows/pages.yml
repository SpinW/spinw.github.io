name: Build and Publish Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build static files
        id: build
        run: |
          sudo apt update
          sudo apt install libegl1  # Needed for PySide6
          git clone https://github.com/spinw/pySpinW
          mv pySpinW ..
          uv run python ../pySpinW/tools/generate_tutorial_files.py
          mv ../pySpinW/examples/tutorials/tutorial_outputs docs/pyspinw/tutorials
          mv docs/pyspinw/tutorials/index.md docs/pyspinw/tutorials.md
          uv run sphinx-build -M clean docs docs/_build
          uv run sphinx-build -M html docs docs/_build
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
